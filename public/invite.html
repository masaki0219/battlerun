<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ZELIO チャレンジ招待</title>
    <meta name="description" content="ZELIOの友達チャレンジへ参加します。">
    <style>
      body{max-width:560px;margin:auto;padding:48px 20px 80px;background:#f3f6f5;color:#123b37;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.7;text-align:center}
      main{background:#fff;padding:32px 24px;border:1px solid #dbe7e4;border-radius:20px}h1{font-size:26px}.code{font-size:30px;font-weight:900;letter-spacing:7px;margin:24px 0;color:#087b73}
      .button{display:block;margin:12px auto;padding:12px 18px;border:0;border-radius:999px;background:#087b73;color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.secondary{background:#e7f3f1;color:#075f59}small{color:#5d7773}
    </style>
  </head>
  <body>
    <main>
      <p><small>ZELIO INVITATION</small></p>
      <h1>チャレンジに招待されました</h1>
      <p>アプリを開くと招待コードが自動入力されます。</p>
      <p class="code" id="code">------</p>
      <a class="button" id="open-app" href="zelio://invite">ZELIOで開く</a>
      <button class="button secondary" id="copy-code" type="button">招待コードをコピー</button>
      <p><small>ZELIOを未インストールの場合は、インストール後に上の6桁コードを「友達チャレンジ」から入力してください。</small></p>
    </main>
    <script>
      const value = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
      const code = /^[A-Z0-9]{6}$/.test(value) ? value : '';
      document.getElementById('code').textContent = code || '無効なリンク';
      document.getElementById('open-app').href = code ? `zelio://invite?code=${encodeURIComponent(code)}` : 'zelio://invite';
      document.getElementById('copy-code').disabled = !code;
      document.getElementById('copy-code').addEventListener('click', async () => {
        if (!code) return;
        await navigator.clipboard.writeText(code);
        document.getElementById('copy-code').textContent = 'コピーしました';
      });
    </script>
  </body>
</html>
